<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 390" role="img" aria-labelledby="title description">
  <title id="title">One arrangement, five exposures, then a pause</title>
  <desc id="description">Prepare all selected bins and click Scene ready. Keep the parts still while the app captures 4, 8, 12, 16 and 20 millisecond exposures. When the next arrangement appears, rotate or move the parts and click Scene ready again.</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#466174"/></marker></defs>
  <rect width="1100" height="390" rx="16" fill="#f5f8fa"/>
  <g font-family="system-ui, sans-serif" fill="#17364b">
    <text x="30" y="40" font-size="25" font-weight="700">One Ready click = one exposure sweep</text>
    <text x="30" y="69" font-size="17">Example: a loaded arrangement with the default five exposures.</text>
    <rect x="25" y="100" width="240" height="185" rx="12" fill="#ffffff" stroke="#a9bdcb"/>
    <text x="45" y="132" font-size="20" font-weight="700">1. Prepare all bins</text>
    <circle cx="90" cy="192" r="35" fill="#eef3f6" stroke="#9fb2bf" stroke-width="9"/>
    <circle cx="200" cy="192" r="35" fill="#eef3f6" stroke="#9fb2bf" stroke-width="9"/>
    <rect x="81" y="188" width="18" height="8" rx="2" fill="#89511b"/>
    <rect x="191" y="188" width="18" height="8" rx="2" fill="#89511b"/>
    <text x="145" y="258" text-anchor="middle" font-size="17">Click Scene ready</text>
    <path d="M 278 193 H 315" stroke="#466174" stroke-width="3" marker-end="url(#arrow)"/>
    <rect x="330" y="100" width="440" height="185" rx="12" fill="#e8f2fa" stroke="#7ca2be"/>
    <text x="350" y="132" font-size="20" font-weight="700">2. Keep the parts still</text>
    <g text-anchor="middle" font-size="18" font-weight="600">
      <rect x="350" y="161" width="65" height="62" rx="9" fill="#ffffff"/><text x="382" y="188">4</text><text x="382" y="211" font-size="14">ms</text>
      <rect x="434" y="161" width="65" height="62" rx="9" fill="#ffffff"/><text x="466" y="188">8</text><text x="466" y="211" font-size="14">ms</text>
      <rect x="518" y="161" width="65" height="62" rx="9" fill="#ffffff"/><text x="550" y="188">12</text><text x="550" y="211" font-size="14">ms</text>
      <rect x="602" y="161" width="65" height="62" rx="9" fill="#ffffff"/><text x="634" y="188">16</text><text x="634" y="211" font-size="14">ms</text>
      <rect x="686" y="161" width="65" height="62" rx="9" fill="#ffffff"/><text x="718" y="188">20</text><text x="718" y="211" font-size="14">ms</text>
    </g>
    <text x="550" y="258" text-anchor="middle" font-size="17">Same part positions for all five captures</text>
    <path d="M 784 193 H 820" stroke="#466174" stroke-width="3" marker-end="url(#arrow)"/>
    <rect x="835" y="100" width="240" height="185" rx="12" fill="#fff5dc" stroke="#cba956"/>
    <text x="855" y="132" font-size="20" font-weight="700">3. App pauses</text>
    <text x="855" y="176" font-size="18">Read the next step.</text>
    <text x="855" y="206" font-size="18">Move or rotate parts.</text>
    <text x="855" y="258" font-size="17">Click Scene ready again.</text>
    <text x="30" y="333" font-size="18" font-weight="600">A different arrangement means a different physical placement.</text>
    <text x="30" y="362" font-size="17">Do not move parts during capture. Empty stages repeat automatically; leave all selected bins empty.</text>
  </g>
</svg>
