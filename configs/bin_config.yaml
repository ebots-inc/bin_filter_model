# Existing scene-0/B2 layout. Operators do not need to measure these coordinates.
# In Bin Setup, use "Create bin layout" to mark complete bins on an empty-scene
# preview. The app derives bounds, interior seeds, and rim heights, then saves
# the reviewed layout under data/bin_model/layouts for a new collection.
model_type: calibrated_bin_background
scene_id: 0
frame_id: B2
bins:
  bin_a:
    kind: height_field
    xy_bounds_mm:
    - - 425.0
      - -499.0
    - - 630.0
      - -305.0
    seed_xy_mm:
    - 530.0
    - -410.0
    z_bounds_mm:
    - -165.0
    - -65.0
    cell_size_mm: 1.0
    min_capture_support: 5
    min_points_per_cell: 3
    residual_quantile: 0.99
    alignment_margin_mm: 0.5
    min_tolerance_mm: 1.0
    max_tolerance_mm: 4.0
    max_reference_height_mm: -82.0
    max_height_above_surface_mm: 150.0
    registration:
      height_band_mm: [-82.0, -65.0]
      max_slope: 0.35
      min_surface_points: 200
      min_boundary_points: 80
      min_quadrant_points: 20
  bin_b:
    kind: height_field
    xy_bounds_mm:
    - - 435.0
      - -693.0
    - - 635.0
      - -500.0
    seed_xy_mm:
